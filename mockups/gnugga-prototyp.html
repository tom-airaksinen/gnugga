<title>Gnugga</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0f1b1e" />
<style>
  /* Gnugga – prototyp v0. Syskon till Flippa: samma mörka PWA-känsla, egen accent (mint)
     så de två apparna går att skilja på hemskärmen. Medvetet enkeltema. */
  :root {
    color-scheme: dark;
    --bg: #0f1b1e;
    --surface: #17282c;
    --surface-2: #1f353a;
    --text: #eef4f2;
    --muted: #93a8a4;
    --accent: #3fcfa8;
    --accent-ink: #062b22;
    --warm: #f2b84b;
    --good: #5bbf72;
    --fail: #e0604f;
    --line: #2b444a;
    --track: rgba(255,255,255,.10);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); min-height: 100dvh; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app { width: 100%; max-width: 430px; min-height: 100dvh; display: flex; flex-direction: column; position: relative; }
  .screen { display: none; flex: 1; flex-direction: column; animation: fadein .18s ease; }
  .screen.on { display: flex; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen { animation: none; } * { transition: none !important; } }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Header */
  .hdr { display: flex; align-items: center; gap: 10px; padding: calc(14px + env(safe-area-inset-top)) 16px 10px; }
  .hdr h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.01em; flex: 1; display: flex; align-items: center; gap: 8px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
    display: inline-grid; place-items: center; font-size: 17px; font-weight: 900; }
  .ib { width: 38px; height: 38px; border-radius: 11px; background: var(--surface); display: grid; place-items: center; font-size: 1.15rem; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 600; }
  .back { font-size: 1.3rem; padding: 6px 10px 6px 0; color: var(--muted); }
  .hdr .title { font-size: 1.1rem; font-weight: 700; flex: 1; min-width: 0; }

  .pad { padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }

  /* Dagens gnugg */
  .today { background: linear-gradient(160deg, #1b3a3c, #17282c 70%); border: 1px solid var(--line); border-radius: 20px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
  .today h2 { font-size: 1.25rem; font-weight: 800; }
  .today .facts { display: flex; gap: 14px; flex-wrap: wrap; }
  .fact { display: flex; flex-direction: column; gap: 1px; }
  .fact b { font-size: 1.35rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .fact span { font-size: .78rem; color: var(--muted); }
  .cta { background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 1.05rem; border-radius: 14px; padding: 15px; width: 100%; }
  .cta:active { transform: scale(.985); }
  .cta.sec { background: var(--surface-2); color: var(--text); font-weight: 700; }
  .cta.ghost { background: none; color: var(--muted); font-weight: 600; padding: 10px; }

  /* Mönsterlista */
  .group { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--radius); padding: 13px 14px; text-align: left; width: 100%; }
  .row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .row .name { font-weight: 600; font-size: .98rem; }
  .row .bar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
  .lvl { font-size: .72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .lvl.l1 { color: var(--text); }
  .lvl.l2 { background: rgba(63,207,168,.18); color: var(--accent); }
  .lvl.l3 { background: var(--accent); color: var(--accent-ink); }
  .lvl.due { background: rgba(242,184,75,.18); color: var(--warm); }
  .chev { color: var(--muted); }

  /* Mönsterskärm */
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card h3 { font-size: .98rem; font-weight: 700; }
  .rule p { font-size: .98rem; }
  .rule .ro { color: var(--accent); font-weight: 700; }
  .rule .sv { color: var(--warm); }
  .ex { display: flex; flex-direction: column; gap: 8px; }
  .exrow { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
  .exrow .from { color: var(--muted); }
  .exrow .arrow { color: var(--muted); }
  .exrow .to { font-weight: 700; flex: 1; }
  .exrow .sv { color: var(--muted); font-size: .85rem; }
  .spk { font-size: 1.05rem; padding: 4px 6px; border-radius: 8px; }
  details summary { cursor: pointer; font-weight: 700; font-size: .98rem; list-style: none; display: flex; justify-content: space-between; }
  details summary::after { content: "＋"; color: var(--muted); }
  details[open] summary::after { content: "－"; }
  details .more { margin-top: 10px; font-size: .95rem; color: var(--text); display: flex; flex-direction: column; gap: 8px; }
  .note { font-size: .85rem; color: var(--muted); text-align: center; padding: 0 10px; }

  /* Pass */
  .top { display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 14px 8px; }
  .prog { flex: 1; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
  .counter { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tags { display: flex; gap: 6px; padding: 4px 16px 0; flex-wrap: wrap; }
  .tag { font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .tag.type { background: rgba(63,207,168,.15); color: var(--accent); }
  .tag.type.say { background: rgba(242,184,75,.18); color: var(--warm); }
  .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 16px 20px 20px; }
  .task { text-align: center; display: flex; flex-direction: column; gap: 8px; }
  .task .q { font-size: 1rem; color: var(--muted); }
  .task .big { font-size: 2.1rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
  .task .big .blank { display: inline-block; min-width: 3ch; border-bottom: 3px solid var(--accent); }
  .task .sub { font-size: 1rem; color: var(--warm); font-weight: 600; }
  .task .gloss { font-size: .9rem; color: var(--muted); }

  .answer { display: flex; flex-direction: column; gap: 10px; }
  .inp { width: 100%; font: inherit; font-size: 1.5rem; font-weight: 700; text-align: center; padding: 14px; border-radius: 14px;
    background: var(--surface); border: 2px solid var(--line); color: var(--text); -webkit-user-select: text; user-select: text; }
  .inp:focus { border-color: var(--accent); outline: none; }
  .inp.ok { border-color: var(--good); } .inp.bad { border-color: var(--fail); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .keys { display: flex; gap: 8px; justify-content: center; }
  .keys button { min-width: 46px; height: 44px; border-radius: 11px; background: var(--surface-2); font-size: 1.25rem; font-weight: 600; }
  .keys button:active { background: var(--line); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 16px 10px; font-size: 1.15rem; font-weight: 700; }
  .opt:active { background: var(--surface-2); }
  .opt.ok { border-color: var(--good); background: rgba(91,191,114,.15); }
  .opt.bad { border-color: var(--fail); background: rgba(224,96,79,.15); }
  .opt.dim { opacity: .45; }
  .tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tf button { border-radius: 14px; padding: 18px; font-size: 1.15rem; font-weight: 800; border: 2px solid var(--line); background: var(--surface); }
  .tf .yes.ok, .tf .no.ok { border-color: var(--good); background: rgba(91,191,114,.15); }
  .tf .yes.bad, .tf .no.bad { border-color: var(--fail); background: rgba(224,96,79,.15); }
  .timer { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--warm); transform-origin: left; }
  .timer.run i { animation: shrink 4s linear forwards; }
  @keyframes shrink { to { transform: scaleX(0); } }
  .reveal { background: var(--surface); border-radius: 14px; padding: 18px; text-align: center; font-size: 1.7rem; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .selfgrade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .selfgrade button { border-radius: 14px; padding: 16px; font-weight: 800; font-size: 1.05rem; }
  .selfgrade .y { background: rgba(91,191,114,.2); color: var(--good); }
  .selfgrade .n { background: rgba(224,96,79,.2); color: var(--fail); }

  /* Feedback */
  .fb { position: sticky; bottom: 0; margin-top: auto; background: var(--surface); border-top: 3px solid var(--line);
    padding: 16px 18px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px;
    transform: translateY(100%); transition: transform .22s ease; }
  .fb.show { transform: none; }
  .fb.good { border-top-color: var(--good); } .fb.bad { border-top-color: var(--fail); } .fb.hint { border-top-color: var(--warm); }
  .fb .h { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .fb.good .h { color: var(--good); } .fb.bad .h { color: var(--fail); } .fb.hint .h { color: var(--warm); }
  .fb .ans { font-size: 1.35rem; font-weight: 800; }
  .fb .why { font-size: .95rem; color: var(--text); }
  .fb .why .ro { color: var(--accent); font-weight: 700; }
  .fb .acts { display: flex; gap: 10px; margin-top: 4px; }
  .fb .acts .cta { flex: 1; }
  .fb .acts .cta.good { background: var(--good); color: #052b10; }
  .fb .acts .cta.bad { background: var(--fail); color: #fff; }
  .fb .acts .cta.hint { background: var(--warm); color: #2b1a00; }
  .linkish { color: var(--accent); font-weight: 700; font-size: .95rem; text-decoration: underline; text-underline-offset: 3px; }

  /* Intro (nytt mönster i passet) */
  .intro { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 8px 16px 20px; }
  .intro .big-t { font-size: 1.5rem; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }

  /* Klar */
  .done { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 30px 20px 24px; }
  .done h2 { font-size: 1.7rem; font-weight: 800; text-align: center; letter-spacing: -.01em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--surface); border-radius: 14px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .75rem; color: var(--muted); }
  .delta { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 14px; padding: 12px 14px; }
  .delta .n { flex: 1; font-weight: 600; font-size: .95rem; }
  .delta .d { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .delta .d.up { color: var(--accent); font-weight: 700; }
  .tip { background: rgba(242,184,75,.12); border: 1px solid rgba(242,184,75,.35); border-radius: 14px; padding: 12px 14px; font-size: .92rem; }
  .tip b { color: var(--warm); }
  .ver { text-align: center; font-size: .72rem; color: var(--muted); padding: 10px 0 6px; }
</style>

<div id="app">

  <!-- ===== HEM ===== -->
  <section id="s-home" class="screen on">
    <header class="hdr">
      <h1><span class="logo">G</span> Gnugga</h1>
      <button class="chip" id="lang-chip" title="Byt språk">🇷🇴 Rumänska <span class="muted">▾</span></button>
    </header>
    <div class="pad">
      <div class="today">
        <div class="eyebrow">Dagens gnugg</div>
        <h2 id="today-h">Ett nytt mönster och lite repetition</h2>
        <div class="facts" id="today-facts"></div>
        <button class="cta" id="start-today">Gnugga nu · ca 5 min</button>
        <div class="small muted">Blandat pass: mönstren växlar, så du måste välja regel varje gång. Det känns lite jobbigare än att köra ett i taget – och det är precis då det fastnar.</div>
      </div>

      <div class="eyebrow" style="margin-top:6px">Mönster</div>
      <div id="pattern-groups" style="display:flex;flex-direction:column;gap:16px"></div>

      <div class="ver">Prototyp v0 · Böjningsdata från Wiktionary/kaikki.org (CC BY-SA) · <button class="linkish" id="reset" style="font-size:.72rem">nollställ progress</button></div>
    </div>
  </section>

  <!-- ===== MÖNSTER ===== -->
  <section id="s-pattern" class="screen">
    <header class="hdr">
      <button class="back" data-go="s-home">‹</button>
      <div class="title" id="p-title"></div>
      <span class="lvl" id="p-lvl"></span>
    </header>
    <div class="pad" id="p-body"></div>
  </section>

  <!-- ===== PASS ===== -->
  <section id="s-session" class="screen">
    <div class="top">
      <button class="back" id="quit" title="Avsluta passet">✕</button>
      <div class="prog"><i id="prog-i" style="width:0%"></i></div>
      <span class="counter" id="counter">0/0</span>

    <div class="tags" id="tags"></div>

  <!-- ===== KLAR ===== -->
  <section id="s-done" class="screen">
    <div class="done" id="done-body"></div>
  </section>
</div>

<script>
"use strict";
/* ============================================================
   LEXIKON (rumänska). Formerna är kontrollerade mot Wiktionary.
   I riktiga appen genereras detta ur kaikki.org-dumpen.
   ============================================================ */
const NOUNS = [
  // w, genus, bestämd sg, plural, bestämd pl, svenska
  ["casă","f","casa","case","casele","hus"],
  ["fată","f","fata","fete","fetele","flicka"],
  ["carte","f","cartea","cărți","cărțile","bok"],
  ["masă","f","masa","mese","mesele","bord"],
  ["țară","f","țara","țări","țările","land"],
  ["stradă","f","strada","străzi","străzile","gata"],
  ["cafea","f","cafeaua","cafele","cafelele","kaffe"],
  ["mașină","f","mașina","mașini","mașinile","bil"],
  ["limbă","f","limba","limbi","limbile","språk"],
  ["zi","f","ziua","zile","zilele","dag"],
  ["băiat","m","băiatul","băieți","băieții","pojke"],
  ["prieten","m","prietenul","prieteni","prietenii","vän"],
  ["frate","m","fratele","frați","frații","bror"],
  ["câine","m","câinele","câini","câinii","hund"],
  ["om","m","omul","oameni","oamenii","människa"],
  ["copil","m","copilul","copii","copiii","barn"],
  ["oraș","n","orașul","orașe","orașele","stad"],
  ["tren","n","trenul","trenuri","trenurile","tåg"],
  ["hotel","n","hotelul","hoteluri","hotelurile","hotell"],
  ["bilet","n","biletul","bilete","biletele","biljett"],
  ["muzeu","n","muzeul","muzee","muzeele","museum"],
  ["drum","n","drumul","drumuri","drumurile","väg"],
  ["vin","n","vinul","vinuri","vinurile","vin"],
  ["măr","n","mărul","mere","merele","äpple"],
].map(([w,g,def,pl,pldef,sv]) => ({w,g,def,pl,pldef,sv}));

const VERBS = [
  // inf, grupp, presens ×6 (eu tu el noi voi ei), particip, svenska
  ["a lucra","ez",["lucrez","lucrezi","lucrează","lucrăm","lucrați","lucrează"],"lucrat","arbeta"],
  ["a cânta","a",["cânt","cânți","cântă","cântăm","cântați","cântă"],"cântat","sjunga"],
  ["a pleca","a",["plec","pleci","pleacă","plecăm","plecați","pleacă"],"plecat","åka iväg"],
  ["a vorbi","esc",["vorbesc","vorbești","vorbește","vorbim","vorbiți","vorbesc"],"vorbit","prata"],
  ["a locui","esc",["locuiesc","locuiești","locuiește","locuim","locuiți","locuiesc"],"locuit","bo"],
  ["a dormi","i",["dorm","dormi","doarme","dormim","dormiți","dorm"],"dormit","sova"],
  ["a merge","e",["merg","mergi","merge","mergem","mergeți","merg"],"mers","gå, åka"],
  ["a face","e",["fac","faci","face","facem","faceți","fac"],"făcut","göra"],
  ["a înțelege","e",["înțeleg","înțelegi","înțelege","înțelegem","înțelegeți","înțeleg"],"înțeles","förstå"],
  ["a vedea","ea",["văd","vezi","vede","vedem","vedeți","văd"],"văzut","se"],
].map(([inf,grp,pres,part,sv]) => ({inf,grp,pres,part,sv,irr:false}));

const IRREG = [
  ["a fi",["sunt","ești","este","suntem","sunteți","sunt"],"fost","vara"],
  ["a avea",["am","ai","are","avem","aveți","au"],"avut","ha"],
  ["a vrea",["vreau","vrei","vrea","vrem","vreți","vor"],"vrut","vilja"],
  ["a putea",["pot","poți","poate","putem","puteți","pot"],"putut","kunna"],
  ["a lua",["iau","iei","ia","luăm","luați","iau"],"luat","ta"],
  ["a bea",["beau","bei","bea","bem","beți","beau"],"băut","dricka"],
  ["a ști",["știu","știi","știe","știm","știți","știu"],"știut","veta"],
].map(([inf,pres,part,sv]) => ({inf,grp:"irr",pres,part,sv,irr:true}));

const ADJ = [
  // m sg, f sg, m pl, f pl, svenska
  ["bun","bună","buni","bune","bra, god"],
  ["frumos","frumoasă","frumoși","frumoase","vacker"],
  ["mic","mică","mici","mici","liten"],
  ["mare","mare","mari","mari","stor"],
  ["nou","nouă","noi","noi","ny"],
  ["scump","scumpă","scumpi","scumpe","dyr"],
  ["vechi","veche","vechi","vechi","gammal"],
  ["cald","caldă","calzi","calde","varm"],
].map(([ms,fs,mp,fp,sv]) => ({ms,fs,mp,fp,sv}));

const PERS = [
  {ro:"eu", sv:"jag"}, {ro:"tu", sv:"du"}, {ro:"el / ea", sv:"han / hon"},
  {ro:"noi", sv:"vi"}, {ro:"voi", sv:"ni"}, {ro:"ei / ele", sv:"de"},
];
const AUX = ["am","ai","a","am","ați","au"];
const GRP_NAME = { a:"-a-gruppen (som a cânta)", ez:"-ez-gruppen (som a lucra)", esc:"-esc-gruppen (som a vorbi)", i:"-i-gruppen (som a dormi)", e:"-e-gruppen (som a merge)", ea:"-ea-gruppen (som a vedea)", irr:"oregelbundet" };
const GENUS = { f:"feminint", m:"maskulint", n:"neutrum" };
const GENUS_PL = { f:"feminina", m:"maskulina", n:"neutrala" };
const ART = { f:"o", m:"un", n:"un" };

const pick = (arr) => arr[Math.floor(Math.random()*arr.length)];
const shuffle = (a) => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const norm = (s) => (s||"").trim().toLowerCase().replace(/ş/g,"ș").replace(/ţ/g,"ț").replace(/\s+/g," ");
const uniq = (arr, not) => { const out=[]; for (const x of arr){ if (x && x!==not && !out.includes(x)) out.push(x); } return out; };

/* Bestämd artikel-regel i ord, per substantiv (för ledtråd/förklaring) */
function defRule(n) {
  if (n.g === "f") {
    if (n.w.endsWith("ă")) return `Feminina på <span class="ro">-ă</span> byter -ă mot <span class="ro">-a</span>: ${n.w} → <span class="ro">${n.def}</span>.`;
    if (n.w.endsWith("e")) return `Feminina på <span class="ro">-e</span> får <span class="ro">-ea</span>: ${n.w} → <span class="ro">${n.def}</span>.`;
    return `Feminina på <span class="ro">-a/-ea/-i</span> får <span class="ro">-ua</span>: ${n.w} → <span class="ro">${n.def}</span>.`;
  }
  const gn = n.g === "n" ? "Neutrum böjs som maskulint i singular. " : "";
  if (n.w.endsWith("e")) return `${gn}Maskulina på <span class="ro">-e</span> får <span class="ro">-le</span>: ${n.w} → <span class="ro">${n.def}</span>.`;
  if (n.w.endsWith("u")) return `${gn}Maskulina på <span class="ro">-u</span> får bara <span class="ro">-l</span>: ${n.w} → <span class="ro">${n.def}</span>.`;
  return `${gn}Maskulina på konsonant får <span class="ro">-ul</span>: ${n.w} → <span class="ro">${n.def}</span>.`;
}
function plRule(n) {
  const vowel = (n.w.replace(/.$/,"") !== n.pl.replace(/.$/,"") && !n.pl.startsWith(n.w)) ? ` Notera vokalväxlingen i stammen (${n.w} → ${n.pl}) – vanligt i rumänska.` : "";
  if (n.g==="f") return `Feminina får oftast <span class="ro">-e</span> eller <span class="ro">-i</span>: ${n.w} → <span class="ro">${n.pl}</span>.${vowel}`;
  if (n.g==="m") return `Maskulina får <span class="ro">-i</span>: ${n.w} → <span class="ro">${n.pl}</span>.${vowel}`;
  return `Neutrum får <span class="ro">-e</span> eller <span class="ro">-uri</span> (och beter sig som feminint i plural): ${n.w} → <span class="ro">${n.pl}</span>.${vowel}`;
}
function plDefRule(n) {
  const end = n.pl.endsWith("uri") ? "-uri → -urile" : n.pl.endsWith("e") ? "-e → -ele" : "-i → -ii/-ile";
  return `Utgå från pluralen <span class="ro">${n.pl}</span> och häng på artikeln: ${end} → <span class="ro">${n.pldef}</span>.`;
}
function adjForm(a, g, num) { // neutrum: m i sg, f i pl
  const fem = g==="f" || (g==="n" && num==="pl");
  return num==="sg" ? (fem ? a.fs : a.ms) : (fem ? a.fp : a.mp);
}

/* ============================================================
   MÖNSTER. Varje mönster: regel (≤ 1 skärm), exempel, fördjupning,
   och en generator som skapar en övning {prompt, answer, hint, why, distractors, say}.
   ============================================================ */
const PATTERNS = [
  { id:"n-def", area:"Substantiv", name:"Bestämd form singular", short:"Bestämd form",
    rule:`Rumänskan gör som svenskan: <span class="sv">artikeln hängs på slutet</span> av ordet – hus → hus<b>et</b>, casă → cas<b>a</b>.<br><br>
      <span class="ro">Feminint:</span> -ă → -a (casă → casa) · -e → -ea (carte → cartea) · -a → -ua (cafea → cafeaua)<br>
      <span class="ro">Maskulint & neutrum:</span> konsonant → +ul (băiat → băiatul) · -e → +le (frate → fratele) · -u → +l (muzeu → muzeul)`,
    examples:[["casă","casa","huset"],["băiat","băiatul","pojken"],["frate","fratele","brodern"]],
    more:`<p>Det lönar sig att lära in genus tillsammans med ordet – artikeln avgörs av det. Flippa-tips: skriv <i>casă [f]</i> så syns genuset på kortet.</p>
      <p><b>Neutrum</b> är rumänskans specialitet: ordet beter sig som maskulint i singular (<i>un oraș, orașul</i>) men som feminint i plural (<i>două orașe, orașele</i>).</p>
      <p>Bestämd form används mer än i svenskan: efter <i>cu</i> ("med") står ordet ofta i bestämd form, men efter andra prepositioner (<i>la, în, pe</i>) i obestämd om det inte bestäms närmare: <i>la hotel</i> men <i>la hotelul nostru</i>.</p>`,
    gen(mode){ const n = pick(NOUNS); const w=n.w;
      const cands = uniq([w+"ul", w+"l", w+"le", w.slice(0,-1)+"a", w.slice(0,-1)+"ea", w+"ua", w.slice(0,-1)+"ul"], n.def).filter(x=>x!==w);
      return { q:"Bestämd form av", big:n.w, sub:`${ART[n.g]} ${n.w} · ${n.sv}`, answer:n.def, say:{sv:n.sv+"-et/-en (bestämd form)", ro:n.def},
        hint:`Ordet är <b>${GENUS[n.g]}</b> (${ART[n.g]} ${n.w}). Vilken ändelse får ${GENUS_PL[n.g]} ord som slutar på <b>-${w.slice(-1)}</b>?`,
        why:defRule(n), distractors:shuffle(cands).slice(0,3), tf:{stmt:null} }; } },

  { id:"n-pl", area:"Substantiv", name:"Plural obestämd", short:"Plural",
    rule:`Pluraländelsen beror på genus:<br><br>
      <span class="ro">Feminint:</span> -ă → -e (casă → case) eller -i (țară → țări)<br>
      <span class="ro">Maskulint:</span> → -i (băiat → băieți, prieten → prieteni)<br>
      <span class="ro">Neutrum:</span> → -e (oraș → orașe) eller -uri (tren → trenuri)<br><br>
      <span class="sv">Se upp för vokalväxling</span> i stammen: fată → f<b>e</b>te, masă → m<b>e</b>se, băiat → băi<b>e</b>ți.`,
    examples:[["casă","case","hus (flera)"],["băiat","băieți","pojkar"],["tren","trenuri","tåg (flera)"]],
    more:`<p>Vokalväxlingen (<i>a → e</i>, <i>oa → o</i>, <i>ă → e</i>) är regelbunden men måste nötas per ord. Ett bra sätt: lär in pluralen som en del av glosan, precis som tyskans <i>der Mann, die Männer</i>.</p>
      <p>Räkneord: efter 1 står singular (<i>un tren</i>), efter 2–19 plural utan mer (<i>două trenuri</i>), från 20 kommer <i>de</i> emellan (<i>douăzeci de trenuri</i>).</p>`,
    gen(){ const n = pick(NOUNS); const w=n.w; const st=w.slice(0,-1);
      const cands = uniq([st+"e", st+"i", w+"uri", w+"e", w+"i", st+"uri"], n.pl).filter(x=>x!==w);
      return { q:"Plural av", big:n.w, sub:`${ART[n.g]} ${n.w} · ${n.sv}`, answer:n.pl, say:{sv:"flera "+n.sv, ro:n.pl},
        hint:`Ordet är <b>${GENUS[n.g]}</b>. ${n.g==="f"?"Feminina får -e eller -i.":n.g==="m"?"Maskulina får -i.":"Neutrum får -e eller -uri."} ${n.w.replace(/.$/,"")!==n.pl.replace(/.$/,"")&&!n.pl.startsWith(n.w)?"Och kolla om en vokal i stammen växlar.":""}`,
        why:plRule(n), distractors:shuffle(cands).slice(0,3) }; } },

  { id:"n-pldef", area:"Substantiv", name:"Bestämd form plural", short:"Bestämd plural",
    rule:`Ta pluralen och häng på artikeln:<br><br>
      <span class="ro">-i → -ii</span> (băieți → băieții, oameni → oamenii)<br>
      <span class="ro">-e → -ele</span> (case → casele, orașe → orașele)<br>
      <span class="ro">-uri → -urile</span> (trenuri → trenurile)<br>
      <span class="ro">-i (fem.) → -ile</span> (cărți → cărțile, țări → țările)`,
    examples:[["case","casele","husen"],["băieți","băieții","pojkarna"],["trenuri","trenurile","tågen"]],
    more:`<p>Det är alltså två steg: först rätt plural, sedan rätt artikel. Kan du pluralen är bestämd plural nästan mekanisk. Därför kommer detta mönster efter Plural i appen.</p>`,
    gen(){ const n = pick(NOUNS); const p=n.pl;
      const cands = uniq([p+"le", p+"i", p+"ile", p+"ele", p.slice(0,-1)+"ile", p+"ul"], n.pldef).filter(x=>x!==p);
      return { q:"Bestämd form plural av", big:n.w, sub:`plural: ${n.pl} · ${n.sv}`, answer:n.pldef, say:{sv:n.sv+"-en/-na (bestämd plural)", ro:n.pldef},
        hint:`Utgå från pluralen <b>${n.pl}</b>. Den slutar på <b>-${n.pl.endsWith("uri")?"uri":n.pl.slice(-1)}</b> – vilken artikel hör dit?`,
        why:plDefRule(n), distractors:shuffle(cands).slice(0,3) }; } },

  { id:"v-pres", area:"Verb", name:"Presens – de regelbundna grupperna", short:"Presens",
    rule:`Infinitivens slut avgör gruppen, och gruppen avgör ändelserna. De fyra du möter mest:<br><br>
      <span class="ro">-a</span> (a cânta): cânt · cânți · cântă · cântăm · cântați · cântă<br>
      <span class="ro">-a med -ez</span> (a lucra): lucrez · lucrezi · lucrează · lucrăm · lucrați · lucrează<br>
      <span class="ro">-i med -esc</span> (a vorbi): vorbesc · vorbești · vorbește · vorbim · vorbiți · vorbesc<br>
      <span class="ro">-e</span> (a merge): merg · mergi · merge · mergem · mergeți · merg<br><br>
      <span class="sv">Genväg:</span> "vi" slutar alltid på <b>-m</b>, "ni" på <b>-ți</b>, och "de" är oftast = "jag".`,
    examples:[["a vorbi, eu","vorbesc","jag pratar"],["a merge, noi","mergem","vi går"],["a lucra, tu","lucrezi","du arbetar"]],
    more:`<p>Om ett <i>-a</i>-verb tar <i>-ez</i> eller inte, och om ett <i>-i</i>-verb tar <i>-esc</i>, syns inte på infinitiven – det måste läras per verb (ordboken anger det). Tumregel: nyare och längre verb tar oftast <i>-ez/-esc</i>.</p>
      <p>Personliga pronomen (<i>eu, tu…</i>) utelämnas normalt, precis som i italienska och spanska. Ändelsen bär personen.</p>
      <p><i>-ea</i>-verb (<i>a vedea</i>) och <i>-i</i>-verb utan <i>-esc</i> (<i>a dormi</i>) finns också, men de är färre.</p>`,
    gen(){ const v = pick(VERBS); const pi = Math.floor(Math.random()*6); const p = PERS[pi];
      return { q:"Presens av", big:v.inf, sub:`${p.ro} · ${p.sv}`, gloss:v.sv, answer:v.pres[pi], say:{sv:`${p.sv} ${v.sv.split(",")[0]}`, ro:v.pres[pi]},
        hint:`Verbet hör till <b>${GRP_NAME[v.grp]}</b>. Vilken ändelse får <b>${p.ro}</b> där?`,
        why:`${v.inf} (${GRP_NAME[v.grp]}): ${v.pres.map((f,i)=>i===pi?`<span class="ro">${f}</span>`:f).join(" · ")}`,
        distractors:shuffle(uniq(v.pres, v.pres[pi])).slice(0,3) }; } },

  { id:"v-irr", area:"Verb", name:"Oregelbundna kärnverb", short:"Oregelbundna",
    rule:`Sju verb du behöver hela tiden och som inte följer mönstren. Lär dem som helheter:<br><br>
      <span class="ro">a fi</span> (vara): sunt · ești · este · suntem · sunteți · sunt<br>
      <span class="ro">a avea</span> (ha): am · ai · are · avem · aveți · au<br>
      <span class="ro">a vrea</span> (vilja): vreau · vrei · vrea · vrem · vreți · vor<br>
      <span class="ro">a putea</span> (kunna): pot · poți · poate · putem · puteți · pot<br>
      <span class="ro">a lua</span> (ta) · <span class="ro">a bea</span> (dricka) · <span class="ro">a ști</span> (veta)`,
    examples:[["a fi, eu","sunt","jag är"],["a avea, noi","avem","vi har"],["a vrea, eu","vreau","jag vill"]],
    more:`<p><i>a avea</i> är dubbelt viktigt: det är också hjälpverbet i perfekt (<i>am mâncat</i> = jag har ätit / jag åt).</p>
      <p>Chunks värda att kunna utantill: <i>aș vrea</i> (jag skulle vilja), <i>nu știu</i> (jag vet inte), <i>pot să…?</i> (kan jag…?), <i>mi-e foame</i> (jag är hungrig – bokstavligen "mig är hunger").</p>`,
    gen(){ const v = pick(IRREG); const pi = Math.floor(Math.random()*6); const p = PERS[pi];
      return { q:"Presens av", big:v.inf, sub:`${p.ro} · ${p.sv}`, gloss:v.sv, answer:v.pres[pi], say:{sv:`${p.sv} ${v.sv}`, ro:v.pres[pi]},
        hint:`Oregelbundet – här hjälper ingen ändelseregel. Tänk på hela raden för <b>${v.inf}</b> och plocka <b>${p.ro}</b>.`,
        why:`${v.inf} (${v.sv}): ${v.pres.map((f,i)=>i===pi?`<span class="ro">${f}</span>`:f).join(" · ")}`,
        distractors:shuffle(uniq(v.pres, v.pres[pi])).slice(0,3) }; } },

  { id:"v-perf", area:"Verb", name:"Perfekt – am făcut", short:"Perfekt",
    rule:`Rumänskans vanligaste förflutna tid byggs som svenskans perfekt: <span class="sv">hjälpverb + particip</span>. Hjälpverbet är en kortform av <i>a avea</i>:<br><br>
      <span class="ro">am · ai · a · am · ați · au</span> + particip<br><br>
      am lucrat (jag har arbetat / jag arbetade) · ai mers · a văzut · am fost · ați vorbit · au făcut<br><br>
      Participet: -a → -at (lucrat) · -i → -it (vorbit) · -e/-ea → oregelbundet men lärbart (mers, făcut, văzut).`,
    examples:[["a face, eu","am făcut","jag gjorde"],["a merge, voi","ați mers","ni gick"],["a fi, ei","au fost","de var"]],
    more:`<p>Till skillnad från svenskan används perfekt för nästan allt förflutet i talspråk – "jag åt igår" är <i>am mâncat ieri</i>. Du behöver alltså inte imperfekt för att klara resan.</p>
      <p>Notera att "jag" och "vi" båda har <i>am</i>: <i>am fost</i> kan vara både "jag var" och "vi var". Sammanhanget avgör.</p>`,
    gen(){ const v = pick(VERBS.concat(IRREG)); const pi = Math.floor(Math.random()*6); const p = PERS[pi];
      const ans = `${AUX[pi]} ${v.part}`;
      const cands = uniq(AUX.map(a=>`${a} ${v.part}`), ans);
      return { q:"Perfekt av", big:v.inf, sub:`${p.ro} · ${p.sv}`, gloss:v.sv, answer:ans, say:{sv:`${p.sv} har ${v.sv.split(",")[0]}`, ro:ans},
        hint:`Hjälpverbet är <i>a avea</i> i kortform – vilken form hör till <b>${p.ro}</b>? Participet av ${v.inf} är <b>${v.part}</b>.`,
        why:`am · ai · a · am · ați · au + <b>${v.part}</b> → <span class="ro">${ans}</span>`,
        distractors:shuffle(cands).slice(0,3) }; } },

  { id:"adj", area:"Adjektiv", name:"Adjektivet följer med", short:"Adjektiv",
    rule:`Adjektivet står <span class="sv">efter</span> substantivet och böjs efter dess genus och numerus – som svenskans <i>stor / stort / stora</i>, men med fyra rutor:<br><br>
      <span class="ro">bun</span> (m sg) · <span class="ro">bună</span> (f sg) · <span class="ro">buni</span> (m pl) · <span class="ro">bune</span> (f pl)<br><br>
      un băiat bun · o fată bună · băieți buni · fete bune<br><br>
      Vissa har färre former: <i>mic · mică · mici · mici</i> (tre) · <i>mare · mare · mari · mari</i> (två).<br>
      <span class="sv">Neutrum</span> tar maskulin form i singular och feminin i plural: <i>un oraș mare, orașe mari</i>; <i>un vin bun, vinuri bune</i>.`,
    examples:[["fete + bun","fete bune","bra flickor"],["oraș + frumos","oraș frumos","vacker stad"],["orașe + frumos","orașe frumoase","vackra städer"]],
    more:`<p>Bestämd artikel hamnar på substantivet, inte adjektivet: <i>casa mare</i> (det stora huset), <i>băiatul bun</i>. Sätter man adjektivet först flyttar artikeln dit: <i>marea casă</i> – ovanligt i vardagligt tal, hoppa över tills vidare.</p>
      <p>Adjektiv på <i>-e</i> (<i>mare, rece, verde</i>) har bara två former. Adjektiv på <i>-esc</i> (<i>românesc</i>) har <i>românească</i> i f sg och <i>românești</i> i plural.</p>`,
    gen(){ const n = pick(NOUNS); const a = pick(ADJ); const num = Math.random()<.5?"sg":"pl";
      const nounForm = num==="sg" ? n.w : n.pl; const ans = adjForm(a, n.g, num);
      const fem = n.g==="f" || (n.g==="n" && num==="pl");
      const forms = uniq([a.ms,a.fs,a.mp,a.fp, a.ms+"ă", a.ms+"i", a.ms+"e", a.ms.slice(0,-1)+"ă", a.ms.slice(0,-1)+"i"], ans);
      return { q:"Sätt adjektivet i rätt form", big:`${nounForm} <span class="blank">${" ".repeat(4)}</span>`, sub:`(${a.ms}) · ${num==="sg"?"":"flera "}${n.sv}, ${a.sv}`, answer:ans, fullAnswer:`${nounForm} ${ans}`,
        say:{sv:`${num==="sg"?"":"flera "}${a.sv.split(",")[0]} ${n.sv}`, ro:`${nounForm} ${ans}`},
        hint:`Substantivet är <b>${GENUS[n.g]}</b>, <b>${num==="sg"?"singular":"plural"}</b>.${n.g==="n"?" Neutrum: maskulint i singular, feminint i plural.":""} Vilken av adjektivets fyra rutor är det?`,
        why:`${a.ms} har formerna ${a.ms} · ${a.fs} · ${a.mp} · ${a.fp}. <b>${nounForm}</b> är ${fem?"feminin":"maskulin"} form i ${num==="sg"?"singular":"plural"} → <span class="ro">${nounForm} ${ans}</span>.`,
        distractors:shuffle(forms).slice(0,3), acceptFull:true }; } },
];
const byId = Object.fromEntries(PATTERNS.map(p=>[p.id,p]));

/* ============================================================
   PROGRESS (localStorage). Per mönster: seen, right, fast (rätt på tid), lastSeen.
   Nivåer: Nytt → Lärt → Övat → Automatiskt.
   ============================================================ */
const KEY = "gnugga-proto-progress";
const SEED = { "n-def":{seen:42,right:37,fast:9,due:true}, "n-pl":{seen:12,right:8,fast:0,due:true}, "v-pres":{seen:9,right:6,fast:0,due:true},
  "v-irr":{seen:0,right:0,fast:0}, "v-perf":{seen:0,right:0,fast:0}, "n-pldef":{seen:0,right:0,fast:0}, "adj":{seen:0,right:0,fast:0,next:true} };
let P;
function load(){ try { P = JSON.parse(localStorage.getItem(KEY)) || structuredClone(SEED); } catch(e){ P = structuredClone(SEED); } for (const p of PATTERNS) P[p.id] = P[p.id] || {seen:0,right:0,fast:0}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }
function level(id){ const s=P[id]; if (!s.seen) return {n:0,t:"Nytt"}; if (s.fast>=12 && s.right/s.seen>=.85) return {n:3,t:"Automatiskt"}; if (s.seen>=15 && s.right/s.seen>=.7) return {n:2,t:"Övat"}; return {n:1,t:"Lärt"}; }
function pct(id){ const s=P[id]; if (!s.seen) return 0; const acc = s.right/s.seen; return Math.min(100, Math.round(25 + Math.min(1, s.seen/30)*45*acc + Math.min(1, s.fast/12)*30)); }
const active = () => PATTERNS.filter(p=>P[p.id].seen>0);
const nextNew = () => PATTERNS.find(p=>P[p.id].next && !P[p.id].seen) || PATTERNS.find(p=>!P[p.id].seen);

/* ============================================================
   UI-hjälp
   ============================================================ */
const $ = (s, el=document) => el.querySelector(s);
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); window.scrollTo(0,0); }
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click", ()=>show(b.dataset.go)));
function speak(text){ try { if (!("speechSynthesis" in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/\s*\/.*$/,"")); u.lang="ro-RO"; u.rate=.9;
  const v = speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").toLowerCase().startsWith("ro")); if (v) u.voice=v; speechSynthesis.speak(u); } catch(e){} }
const lvlHtml = (id) => { const l=level(id); return `<span class="lvl l${l.n}">${l.t}</span>`; };

/* ---------- Hem ---------- */
function renderHome(){
  const act = active(); const nn = nextNew();
  const due = act.length ? act.length*3 + 2 : 0;
  $("#today-h").textContent = nn ? `${act.length ? "Repetition + " : ""}nytt mönster: ${nn.name}` : "Blandad repetition";
  $("#today-facts").innerHTML = `<div class="fact"><b>${due + (nn?6:0)}</b><span>övningar</span></div>
    <div class="fact"><b>${act.length}</b><span>mönster att blanda</span></div>
    ${nn ? `<div class="fact"><b>1</b><span>nytt mönster</span></div>` : ""}`;
  const groups = {}; for (const p of PATTERNS) (groups[p.area] ||= []).push(p);
  $("#pattern-groups").innerHTML = Object.entries(groups).map(([area, ps]) => `<div class="group"><div class="eyebrow">${area}</div>` +
    ps.map(p => `<button class="row" data-p="${p.id}"><div class="body"><div class="name">${p.name}</div><div class="bar"><i style="width:${pct(p.id)}%"></i></div></div>${P[p.id].next && !P[p.id].seen ? `<span class="lvl due">Dags</span>` : lvlHtml(p.id)}<span class="chev">›</span></button>`).join("") + `</div>`).join("");
  document.querySelectorAll(".row[data-p]").forEach(b=>b.addEventListener("click", ()=>openPattern(b.dataset.p)));
}
$("#reset").addEventListener("click", ()=>{ localStorage.removeItem(KEY); load(); renderHome(); });
$("#lang-chip").addEventListener("click", ()=>alert("I riktiga appen: byt språk. Fler språk = ny lexikonfil + mönsterfil, samma motor."));

/* ---------- Mönsterskärm ---------- */
let curPattern = null;
function ruleCard(p){ return `<div class="card rule"><h3>Regeln</h3><p>${p.rule}</p></div>
    <div class="card"><h3>Exempel</h3><div class="ex">${p.examples.map(([f,t,sv])=>`<div class="exrow"><span class="from">${f}</span><span class="arrow">→</span><span class="to">${t}</span><span class="sv">${sv}</span><button class="spk" data-say="${t}" title="Lyssna">🔊</button></div>`).join("")}</div></div>
    <div class="card"><details><summary>Fördjupning</summary><div class="more">${p.more}</div></details></div>`; }
function openPattern(id){
  curPattern = byId[id]; const p = curPattern;
  $("#p-title").textContent = p.name; $("#p-lvl").outerHTML = lvlHtml(id).replace('class="lvl', 'id="p-lvl" class="lvl');
  const s = P[id];
  $("#p-body").innerHTML = ruleCard(p) +
    `${s.seen ? `<div class="card"><h3>Din nivå</h3><div class="small muted">${s.seen} övningar · ${Math.round(100*s.right/s.seen)} % rätt · ${s.fast} rätt på tid</div><div class="bar" style="height:8px;border-radius:999px;background:var(--track);overflow:hidden"><i style="display:block;height:100%;width:${pct(id)}%;background:var(--accent)"></i></div><div class="small muted">Automatiskt = 85 % rätt och minst 12 rätt i snabbläget.</div></div>` : ""}
    <button class="cta" id="p-mixed">Gnugga i blandat pass</button>
    <button class="cta sec" id="p-only">Bara det här mönstret · 8 övningar</button>
    <div class="note">Blandat rekommenderas när du kan grunden. "Bara det här" passar första gångerna.</div>`;
  $("#p-mixed").addEventListener("click", ()=>startSession({focus:null}));
  $("#p-only").addEventListener("click", ()=>startSession({focus:id}));
  document.querySelectorAll("#p-body .spk").forEach(b=>b.addEventListener("click", ()=>speak(b.dataset.say)));
  show("s-pattern");
}

/* ============================================================
   PASS
   ============================================================ */
let S = null;
function planSession({focus}){
  const items = [];
  const act = active(); const nn = focus ? null : nextNew();
  const add = (pid, type) => items.push({pid, type});
  if (focus) {
    const isNew = !P[focus].seen;
    if (isNew) items.push({intro:focus});
    for (let i=0;i<8;i++) add(focus, i<2 && isNew ? "valj" : i===6 ? "sag" : i===7 ? "rattfel" : "boj");
    return items;
  }
  // 1. uppvärmning: blandad repetition, svagast först
  const warm = shuffle(act).slice(0,4);
  warm.forEach((p,i)=>add(p.id, i===3 && level(p.id).n>=2 ? "rattfel" : "boj"));
  // 2. nytt mönster: regel → 2 välj → 4 böj blockade
  if (nn) { items.push({intro:nn.id}); add(nn.id,"valj"); add(nn.id,"valj"); for (let i=0;i<4;i++) add(nn.id,"boj"); }
  // 3. blandning av allt aktivt + det nya
  const pool = act.concat(nn?[nn]:[]);
  if (pool.length) {
    const mix = []; for (let i=0;i<6;i++) mix.push(pick(pool));
    mix.forEach((p,i)=>add(p.id, i===2 ? "sag" : i===4 && level(p.id).n>=2 ? "rattfel" : "boj"));
  }
  return items;
}
function startSession(opts){
  S = { items: planSession(opts), i: -1, right:0, total:0, wrongOnce:false, before:{}, log:[] };
  for (const p of PATTERNS) S.before[p.id] = pct(p.id);
  show("s-session"); next();
}
$("#quit").addEventListener("click", ()=>{ clearTimer(); if (S && S.total>0) finish(); else { renderHome(); show("s-home"); } });

function next(){
  hideFb(); clearTimer();
  S.i++;
  if (S.i >= S.items.length) return finish();
  const it = S.items[S.i];
  const n = S.items.filter(x=>!x.intro).length; const done = S.items.slice(0,S.i).filter(x=>!x.intro).length;
  $("#prog-i").style.width = (100*done/n)+"%"; $("#counter").textContent = `${done}/${n}`;
  if (it.intro) return renderIntro(byId[it.intro]);
  const p = byId[it.pid]; const ex = p.gen(it.type);
  S.cur = {p, ex, type:it.type, attempts:0, t0:performance.now()};
  const TYPE = {valj:"Välj", boj:"Böj", sag:"Säg det", rattfel:"Rätt eller fel?"};
  $("#tags").innerHTML = `<span class="tag">${p.short}</span><span class="tag type ${it.type==="sag"?"say":""}">${TYPE[it.type]}</span>${it.type==="rattfel"?`<span class="tag">på tid</span>`:""}`;
  ({valj:renderValj, boj:renderBoj, sag:renderSag, rattfel:renderRattfel})[it.type](p, ex);
}
function renderIntro(p){
  $("#tags").innerHTML = `<span class="tag type">Nytt mönster</span>`;
  $("#stage").className = "intro";
  $("#stage").innerHTML = `<div class="eyebrow">${p.area}</div><div class="big-t">${p.name}</div>${ruleCard(p)}
    <div class="note">Läs en gång – max en halv minut. Resten lär du dig genom att göra. Regeln finns alltid ett tryck bort under passet.</div>
    <button class="cta" id="intro-go">Kör</button>`;
  P[p.id].next = false;
  document.querySelectorAll("#stage .spk").forEach(b=>b.addEventListener("click", ()=>speak(b.dataset.say)));
  $("#intro-go").addEventListener("click", next);
}
function taskHtml(ex){ return `<div class="task"><div class="q">${ex.q}</div><div class="big">${ex.big}</div>${ex.sub?`<div class="sub">${ex.sub}</div>`:""}${ex.gloss?`<div class="gloss">${ex.gloss}</div>`:""}</div>`; }

/* --- Välj --- */
function renderValj(p, ex){
  $("#stage").className = "stage";
  const opts = shuffle([ex.answer, ...ex.distractors].slice(0,4));
  $("#stage").innerHTML = taskHtml(ex) + `<div class="answer"><div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join("")}</div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click", ()=>{
    const ok = b.dataset.v === ex.answer;
    document.querySelectorAll(".opt").forEach(o=>{ o.disabled=true; if (o.dataset.v===ex.answer) o.classList.add("ok"); else if (o===b) o.classList.add("bad"); else o.classList.add("dim"); });
    grade(ok, {final:true});
  }));
}
/* --- Böj (skriv) --- */
function renderBoj(p, ex){
  $("#stage").className = "stage";
  $("#stage").innerHTML = taskHtml(ex) + `<div class="answer"><input class="inp" id="inp" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="done" placeholder="skriv formen" />
    <div class="keys">${["ă","â","î","ș","ț"].map(c=>`<button data-c="${c}">${c}</button>`).join("")}</div>
    <button class="cta" id="check">Kolla</button></div>`;
  const inp = $("#inp");
  document.querySelectorAll(".keys button").forEach(b=>b.addEventListener("click", ()=>{ const s=inp.selectionStart||inp.value.length; inp.value = inp.value.slice(0,s)+b.dataset.c+inp.value.slice(s); inp.focus(); inp.setSelectionRange(s+1,s+1); }));
  const check = () => { const v = norm(inp.value); if (!v) { inp.focus(); return; }
    const ok = v === norm(ex.answer) || (ex.acceptFull && v === norm(ex.fullAnswer));
    inp.classList.remove("ok","bad"); inp.classList.add(ok?"ok":"bad");
    grade(ok, {final: ok || S.cur.attempts>=1}); };
  $("#check").addEventListener("click", check);
  inp.addEventListener("keydown", e=>{ if (e.key==="Enter") check(); });
  setTimeout(()=>inp.focus(), 50);
}
/* --- Säg det (cover & recall, självbedömning) --- */
function renderSag(p, ex){
  $("#stage").className = "stage";
  $("#stage").innerHTML = `<div class="task"><div class="q">Säg det högt på rumänska</div><div class="big">${ex.say.sv}</div><div class="sub">${ex.big.replace(/<[^>]+>/g,"").trim()} · ${ex.sub||""}</div></div>
    <div class="answer"><button class="cta sec" id="reveal">Visa svaret</button></div>`;
  $("#reveal").addEventListener("click", ()=>{
    $(".answer").innerHTML = `<div class="reveal">${ex.say.ro} <button class="spk" data-say="${ex.say.ro}">🔊</button></div>
      <div class="note">Sa du så? Var ärlig – det är bara du som ser.</div>
      <div class="selfgrade"><button class="y" id="sg-y">Ja, rätt</button><button class="n" id="sg-n">Nej / osäker</button></div>`;
    speak(ex.say.ro);
    $(".spk").addEventListener("click", ()=>speak(ex.say.ro));
    $("#sg-y").addEventListener("click", ()=>grade(true, {final:true, silent:true}));
    $("#sg-n").addEventListener("click", ()=>grade(false, {final:true}));
  });
}
/* --- Rätt eller fel? (tidspressad) --- */
let timer = null;
function clearTimer(){ if (timer) { clearTimeout(timer); timer=null; } }
function renderRattfel(p, ex){
  $("#stage").className = "stage";
  const truth = Math.random() < .5;
  const shown = truth ? (ex.fullAnswer||ex.answer) : (ex.acceptFull ? (ex.fullAnswer.replace(ex.answer, pick(ex.distractors))) : pick(ex.distractors));
  S.cur.truth = truth; S.cur.shown = shown;
  const ctx = ex.q.replace(/ av$/,"").replace("Sätt adjektivet i rätt form","Adjektivform");
  $("#stage").innerHTML = `<div class="task"><div class="q">${ctx} · ${ex.big.replace(/<[^>]+>/g,"").trim()} · ${(ex.sub||"").split("·")[0]}</div><div class="big">${shown}</div><div class="gloss">Stämmer det?</div></div>
    <div class="answer"><div class="timer run"><i></i></div><div class="tf"><button class="yes" id="tf-y">✓ Rätt</button><button class="no" id="tf-n">✗ Fel</button></div></div>`;
  const answer = (said) => { clearTimer(); const ok = said === truth;
    $("#tf-y").disabled = $("#tf-n").disabled = true;
    $(truth ? "#tf-y" : "#tf-n").classList.add("ok"); if (!ok && said!==null) $(said ? "#tf-y" : "#tf-n").classList.add("bad");
    grade(ok, {final:true, timeout: said===null}); };
  $("#tf-y").addEventListener("click", ()=>answer(true));
  $("#tf-n").addEventListener("click", ()=>answer(false));
  timer = setTimeout(()=>answer(null), 4000);
}

/* --- Bedömning + feedback i två steg --- */
function grade(ok, {final, silent, timeout}={}){
  const c = S.cur; c.attempts++;
  const ms = performance.now() - c.t0;
  if (ok) {
    S.right++; S.total++; const s = P[c.p.id]; s.seen++; s.right++; if (c.type==="rattfel" || (c.type==="boj" && ms < 6000 && c.attempts===1)) s.fast++; s.due=false; save();
    S.log.push({pid:c.p.id, ok:true});
    const praise = c.attempts>1 ? "Rätt på andra försöket" : pick(["Rätt", "Precis", "Ja", "Snyggt"]);
    const extra = c.type==="rattfel" ? `<div class="why">${c.truth ? "Formen stämde." : `Rätt form är <span class="ro">${c.ex.fullAnswer||c.ex.answer}</span>.`} ${c.ex.why}</div>` :
                  (c.attempts>1 || silent) ? "" : `<div class="why muted small">${c.ex.why}</div>`;
    showFb("good", `<div class="h">✓ ${praise}</div><div class="ans">${c.ex.fullAnswer||c.ex.answer} <button class="spk" data-say="${c.ex.say.ro}">🔊</button></div>${extra}<div class="acts"><button class="cta good" id="fb-next">Fortsätt</button></div>`);
  } else if (!final) {
    // Steg 1: ledtråd utan facit, nytt försök
    showFb("hint", `<div class="h">Inte riktigt – en ledtråd</div><div class="why">${c.ex.hint}</div><div class="acts"><button class="cta hint" id="fb-retry">Försök igen</button><button class="cta ghost" id="fb-giveup">Visa svaret</button></div>`);
    $("#fb-retry").addEventListener("click", ()=>{ hideFb(); const inp=$("#inp"); if (inp){ inp.classList.remove("bad"); inp.select(); inp.focus(); } });
    $("#fb-giveup").addEventListener("click", ()=>grade(false, {final:true}));
    return;
  } else {
    // Steg 2: facit + varför
    S.total++; const s = P[c.p.id]; s.seen++; s.due=true; save();
    S.log.push({pid:c.p.id, ok:false});
    const head = timeout ? "Tiden gick ut" : c.type==="rattfel" ? (c.truth ? "Den var faktiskt rätt" : "Den var fel") : "Inte den här gången";
    showFb("bad", `<div class="h">✗ ${head}</div><div class="ans">${c.ex.fullAnswer||c.ex.answer} <button class="spk" data-say="${c.ex.say.ro}">🔊</button></div><div class="why">${c.ex.why}</div>
      <div><button class="linkish" id="fb-rule">Visa hela regeln</button></div><div class="acts"><button class="cta bad" id="fb-next">Fortsätt</button></div>`);
    $("#fb-rule").addEventListener("click", ()=>{ $("#fb .why").innerHTML = c.p.rule; $("#fb-rule").remove(); });
  }
  $("#fb-next").addEventListener("click", next);
  document.querySelectorAll("#fb .spk").forEach(b=>b.addEventListener("click", ()=>speak(b.dataset.say)));
}
function showFb(kind, html){ const fb=$("#fb"); fb.className = `fb show ${kind}`; fb.innerHTML = html; }
function hideFb(){ const fb=$("#fb"); fb.className="fb"; fb.innerHTML=""; }

/* --- Klar --- */
function finish(){
  clearTimer(); hideFb();
  const touched = [...new Set(S.log.map(l=>l.pid))];
  const acc = S.total ? Math.round(100*S.right/S.total) : 0;
  const tips = [
    "Blandade övningar känns svårare än att köra ett mönster i taget. Det är meningen: du tvingas välja regel, inte bara följa den.",
    "Fel svar är inte slöseri. Ledtråd före facit gör att du själv rättar – det fastnar bättre än att bara se rätt svar.",
    "Att säga formen högt ger en annan bana in i minnet än att skriva den. Skippa inte Säg det-övningarna.",
    "Ett nytt mönster behöver flera pass de första dagarna. Sedan glesare – appen sköter det.",
  ];
  $("#done-body").innerHTML = `<div style="text-align:center;font-size:2.6rem">${acc>=80?"🧽✨":"🧽"}</div><h2>${acc>=80?"Blankt!":"Gnuggat"}</h2>
    <div class="stats"><div class="stat"><b>${S.total}</b><span>övningar</span></div><div class="stat"><b>${S.right}</b><span>rätt</span></div><div class="stat"><b>${acc} %</b><span>träffsäkerhet</span></div></div>
    <div class="eyebrow">Mönster i passet</div>
    <div style="display:flex;flex-direction:column;gap:8px">${touched.map(pid=>{ const b=S.before[pid], a=pct(pid); const d=a-b; return `<div class="delta"><div class="n">${byId[pid].name}</div>${lvlHtml(pid)}<div class="d ${d>0?"up":""}">${d>0?"+":""}${d} %</div></div>`; }).join("")}</div>
    <div class="tip"><b>Grundtanke.</b> ${pick(tips)}</div>
    <button class="cta" id="done-home">Klart</button>`;
  $("#done-home").addEventListener("click", ()=>{ renderHome(); show("s-home"); });
  show("s-done");
}

/* --- Start --- */
load(); renderHome();
$("#start-today").addEventListener("click", ()=>startSession({focus:null}));
if ("speechSynthesis" in window) speechSynthesis.getVoices();
</script>
